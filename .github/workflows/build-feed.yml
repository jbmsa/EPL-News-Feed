name: Build Unified EPL Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install feedparser requests

      - name: Build merged EPL feed
        run: |
          python3 << 'EOF'
          import feedparser
          import datetime
          import os

          # Ensure docs folder exists
          os.makedirs("docs", exist_ok=True)

          sources = [
              "https://www.nbcsports.com/rss/premier-league",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCqZQlzSHbVJrwrn5XvzrzcA",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCNAf1k0yIjyGu3k9BwAg3lg",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCpryVRk_VDudG8SHXgWcG0w",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UC9LQwHZoucFT94UO8G9o8tQ",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCxgkH9s9hLr2GfQb6uVn7Ww",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UC2vUeOeR3_1dC7lRzPp8X0w",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UC6yW44UGJJBvYTlfC7CRg2Q"
          ]

          entries = []

          for url in sources:
              print(f"Fetching: {url}")
              feed = feedparser.parse(url)
              for item in feed.entries:
                  published = getattr(item, "published", None)
                  if published:
                      try:
                          parsed = datetime.datetime(*item.published_parsed[:6])
                      except:
                          parsed = datetime.datetime.min
                  else:
                      parsed = datetime.datetime.min

                  entries.append({
                      "title": item.get("title", "No title"),
                      "link": item.get("link", ""),
                      "published": published or "",
                      "published_parsed": parsed
                  })

          entries.sort(
              key=lambda e: e.get("published_parsed", datetime.datetime.min),
              reverse=True
          )

          xml = '<?xml version="1.0" encoding="UTF-8"?>\n'
          xml += '<rss version="2.0">\n<channel>\n'
          xml += '<title>Unified EPL Video Feed</title>\n'
          xml += '<link>https://jbmsa.github.io/EPL-News-Feed/</link>\n'
          xml += '<description>Merged EPL video highlights</description>\n'

          for e in entries[:50]:
              xml += f"<item><title>{e['title']}</title>"
              xml += f"<link>{e['link']}</link>"
              xml += f"<pubDate>{e['published']}</pubDate></item>\n"

          xml += "</channel>\n</rss>"

          with open("docs/epl-video.xml", "w") as f:
              f.write(xml)

          print("Feed built successfully.")
          EOF

      - name: Commit and push feed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/epl-video.xml
          git commit -m "Update EPL feed" || echo "No changes to commit"
          git push || echo "No changes to push"
