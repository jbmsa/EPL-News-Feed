name: Build Unified EPL Feed

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Build merged EPL feed
        run: |
          python3 << 'EOF'
          import feedparser
          import datetime
          import requests

          TIMEOUT = 10  # seconds

          YT = "https://yt.lemnoslife.com/videos?channel_id="

          sources = [
              "https://www.nbcsports.com/rss/premier-league",
              YT + "UCqZQlzSHbVJrwrn5XvzrzcA",
              YT + "UCNAf1k0yIjyGu3k9BwAg3lg",
              YT + "UCpryVRk_VDudG8SHXgWcG0w",
              YT + "UC9LQwHZoucFT94UO8G9o8tQ",
              YT + "UCxgkH9s9hLr2GfQb6uVn7Ww",
              YT + "UC2vUeOeR3_1dC7lRzPp8X0w",
              YT + "UC6yW44UGJJBvYTlfC7CRg2Q"
          ]

          entries = []

          for url in sources:
              print(f"Fetching: {url}")
              try:
                  if "lemnoslife" in url:
                      r = requests.get(url, timeout=TIMEOUT)
                      data = r.json()
                      for item in data.get("items", []):
                          published = item.get("publishedAt", "")
                          try:
                              parsed = datetime.datetime.fromisoformat(published.replace("Z",""))
                          except:
                              parsed = datetime.datetime.min

                          entries.append({
                              "title": item.get("title", "No title"),
                              "link": f"https://www.youtube.com/watch?v={item.get('id')}",
                              "published": published,
                              "published_parsed": parsed
                          })
                  else:
                      feed = feedparser.parse(url)
                      entries.extend(feed.entries)

              except Exception as e:
                  print(f"Skipping {url}: {e}")

          # Sort newest first
          entries.sort(key=lambda e: e.get("published_parsed", datetime.datetime.min), reverse=True)

          # Build RSS XML
          xml = '<?xml version="1.0" encoding="UTF-8"?>\n'
          xml += '<rss version="2.0">\n<channel>\n'
          xml += '<title>Unified EPL Video Feed</title>\n'
          xml += '<link>https://jbmsa.github.io/EPL-News-Feed/</link>\n'
          xml += '<description>Merged EPL video highlights</description>\n'

          for e in entries[:50]:
              xml += f"<item><title>{e.get('title')}</title>"
              xml += f"<link>{e.get('link')}</link>"
              xml += f"<pubDate>{e.get('published')}</pubDate></item>\n"

          xml += "</channel>\n</rss>"

          with open("epl-video.xml", "w") as f:
              f.write(xml)

          print("Feed built successfully.")
          EOF

      - name: Commit merged feed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add epl-video.xml
          git commit -m "Updated merged EPL feed" || echo "No changes"
          git push
