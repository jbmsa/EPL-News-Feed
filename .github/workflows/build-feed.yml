name: Build Unified EPL Feed

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install feedparser
        run: pip install feedparser requests

      - name: Build merged EPL feed
        run: |
          python3 << 'EOF'
          import feedparser
          import datetime
          import requests

          # YouTube proxy that works inside GitHub Actions
          YT = "https://yt.lemnoslife.com/videos?channel_id="

          sources = [
              "https://www.nbcsports.com/rss/premier-league",
              YT + "UCqZQlzSHbVJrwrn5XvzrzcA",  # Premier League
              YT + "UCNAf1k0yIjyGu3k9BwAg3lg",  # Sky Sports Football
              YT + "UCpryVRk_VDudG8SHXgWcG0w",  # Arsenal
              YT + "UC9LQwHZoucFT94UO8G9o8tQ",  # Liverpool
              YT + "UCxgkH9s9hLr2GfQb6uVn7Ww",  # Man City
              YT + "UC2vUeOeR3_1dC7lRzPp8X0w",  # Spurs
              YT + "UC6yW44UGJJBvYTlfC7CRg2Q"   # Man United
          ]

          entries = []

          for url in sources:
              try:
                  if "lemnoslife" in url:
                      # YouTube JSON → convert to RSS-like entries
                      data = requests.get(url).json()
                      for item in data.get("items", []):
                          entries.append({
                              "title": item.get("title", "No title"),
                              "link": f"https://www.youtube.com/watch?v={item.get('id')}",
                              "published": item.get("publishedAt", ""),
                              "published_parsed": datetime.datetime.fromisoformat(item.get("publishedAt", "").replace("Z",""))
                          })
                  else:
                      # Normal RSS feed
                      feed = feedparser.parse(url)
                      entries.extend(feed.entries)
              except Exception as e:
                  print(f"Error parsing {url}: {e}")

          # Sort newest first
          def sort_key(e):
              return e.get("published_parsed", datetime.datetime.min)

          entries.sort(key=sort_key, reverse=True)

          # Build RSS XML
          xml = '<?xml version="1.0" encoding="UTF-8"?>\n'
          xml += '<rss version="2.0">\n<channel>\n'
          xml += '<title>Unified EPL Video Feed</title>\n'
          xml += '<link>https://jbmsa.github.io/EPL-News-Feed/</link>\n'
          xml += '<description>Merged EPL video highlights</description>\n'

          for e in entries[:50]:
              title = e.get("title", "No title")
              link = e.get("link", "")
              pub = e.get("published", "")
              xml += f"<item><title>{title}</title><link>{link}</link><pubDate>{pub}</pubDate></item>\n"

          xml += "</channel>\n</rss>"

          with open("epl-video.xml", "w") as f:
              f.write(xml)
          EOF

      - name: Commit merged feed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add epl-video.xml
          git commit -m "Updated merged EPL feed" || echo "No changes"
          git push
